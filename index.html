<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="News Reader">
<title>News → Apps</title>
<style>
  :root {
    --bg:#f5f5f7; --surface:#fff; --text:#1d1d1f; --muted:#6e6e73;
    --border:rgba(0,0,0,0.1); --accent:#0071e3; --green:#28a745;
    --wsj:#c00; --nyt:#000; --nyt-light:#326891;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --border:rgba(255,255,255,0.12); --accent:#2997ff; --green:#30d158; --wsj:#ff453a; --nyt:#e0e0e0; --nyt-light:#74b5e0; }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); padding-bottom:calc(env(safe-area-inset-bottom)+60px); }

  header { position:sticky; top:0; z-index:10; background:rgba(245,245,247,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:0.5px solid var(--border); padding:10px 14px 0; }
  @media (prefers-color-scheme:dark) { header { background:rgba(0,0,0,0.92); } }

  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .logo { font-size:17px; font-weight:700; letter-spacing:-0.2px; }
  .badge { font-size:12px; font-weight:600; background:var(--accent); color:#fff; padding:3px 10px; border-radius:20px; display:none; }

  .pub-row { display:flex; gap:6px; margin-bottom:8px; }
  .pub-btn { flex:1; padding:7px 4px; border-radius:9px; border:0.5px solid var(--border); background:var(--surface); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .pub-btn.active { color:#fff; border-color:transparent; }
  .pub-btn[data-pub="all"].active    { background:var(--accent); }
  .pub-btn[data-pub="toyota"].active { background:#c8102e; }
  .pub-btn[data-pub="wsj"].active    { background:var(--wsj); }
  .pub-btn[data-pub="nyt"].active    { background:#326891; }

  .search-wrap { position:relative; margin-bottom:8px; }
  .search-input { width:100%; padding:8px 32px 8px 34px; border-radius:10px; border:none; background:rgba(120,120,128,0.16); font-size:15px; color:var(--text); outline:none; -webkit-appearance:none; }
  .search-input::placeholder { color:var(--muted); }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search-icon svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:rgba(120,120,128,0.4); border:none; border-radius:50%; width:17px; height:17px; cursor:pointer; display:none; align-items:center; justify-content:center; padding:0; }
  .search-clear svg { width:9px; height:9px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; }
  .search-clear.visible { display:flex; }

  .tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding-bottom:1px; margin:0 -2px; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex-shrink:0; font-size:13px; font-weight:500; color:var(--muted); padding:7px 12px; border:none; background:none; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  #main { padding:10px 12px; }
  #loading { text-align:center; padding:60px 16px; color:var(--muted); }
  .spinner { width:26px; height:26px; border:2.5px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .75s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .info { background:var(--surface); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--muted); margin-bottom:8px; border:0.5px solid var(--border); line-height:1.5; }
  .info strong { color:var(--text); }

  .articles { display:flex; flex-direction:column; gap:2px; }
  .card-row { display:flex; align-items:stretch; background:var(--surface); border-radius:12px; overflow:hidden; }

  /* NYT articles are direct links; WSJ articles are copy-to-clipboard */
  .card-body { flex:1; padding:12px 12px 11px 14px; cursor:pointer; min-width:0; text-decoration:none; color:inherit; display:block; }
  .card-body:active { background:rgba(0,0,0,0.04); }
  @media (prefers-color-scheme:dark) { .card-body:active { background:rgba(255,255,255,0.06); } }

  .card-source { font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; display:block; margin-bottom:3px; }
  .card-source.wsj { color:var(--wsj); }
  .card-source.nyt { color:var(--nyt-light); }
  .card-title { font-size:15px; font-weight:600; line-height:1.35; margin-bottom:3px; color:var(--text); }
  .card-desc { font-size:13px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:3px; }
  .card-time { font-size:11px; color:var(--muted); }

  .card-action { flex-shrink:0; width:50px; border:none; border-left:0.5px solid var(--border); background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:0 4px; color:var(--muted); font-size:9px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; text-decoration:none; }
  .card-action:active { background:rgba(0,0,0,0.05); }
  .card-action svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .card-action.copied { color:var(--green); }

  mark { background:rgba(0,113,227,0.18); color:inherit; border-radius:2px; }

  #toast { position:fixed; bottom:calc(env(safe-area-inset-bottom)+24px); left:50%; transform:translateX(-50%) translateY(20px); background:rgba(30,30,30,0.92); color:#fff; font-size:13px; font-weight:500; padding:9px 18px; border-radius:20px; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; white-space:nowrap; z-index:100; backdrop-filter:blur(10px); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .empty { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; line-height:1.7; }
  .retry-btn { display:inline-block; margin-top:14px; padding:9px 20px; background:var(--accent); color:#fff; border-radius:20px; font-size:14px; font-weight:600; border:none; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="logo">News Reader</div>
    <div id="badge" class="badge"></div>
  </div>
  <div class="pub-row">
    <button class="pub-btn active" data-pub="all">All</button>
    <button class="pub-btn" data-pub="toyota" data-keyword="toyota">Toyota</button>
    <button class="pub-btn" data-pub="wsj">WSJ</button>
    <button class="pub-btn" data-pub="nyt">NYT</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></span>
    <input class="search-input" id="search-input" type="search" placeholder="Search headlines..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="search-clear" id="search-clear" aria-label="Clear"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="main">
  <div id="loading"><div class="spinner"></div><div>Fetching feeds…</div></div>
  <div id="result" style="display:none"></div>
</div>
<div id="toast"></div>

<script>
const SOURCES = {
  wsj: {
    cls: 'wsj',
    // WSJ: copy headline, open in Apple News manually
    mode: 'copy',
    feeds: [
      { id:'wsj-usnews',    label:'US News',     url:'https://feeds.content.dowjones.io/public/rss/RSSUSnews' },
      { id:'wsj-world',     label:'World',       url:'https://feeds.content.dowjones.io/public/rss/RSSWorldNews' },
      { id:'wsj-markets',   label:'Markets',     url:'https://feeds.content.dowjones.io/public/rss/RSSMarketsMain' },
      { id:'wsj-business',  label:'Business',    url:'https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness' },
      { id:'wsj-economy',   label:'Economy',     url:'https://feeds.content.dowjones.io/public/rss/socialeconomyfeed' },
      { id:'wsj-tech',      label:'Tech',        url:'https://feeds.content.dowjones.io/public/rss/RSSWSJD' },
      { id:'wsj-opinion',   label:'Opinion',     url:'https://feeds.content.dowjones.io/public/rss/RSSOpinion' },
      { id:'wsj-lifestyle', label:'Life & Arts', url:'https://feeds.content.dowjones.io/public/rss/RSSLifestyle' },
      { id:'wsj-realestate',label:'Real Estate', url:'https://feeds.content.dowjones.io/public/rss/RSSRealEstate' },
      { id:'wsj-politics',  label:'Politics',    url:'https://feeds.content.dowjones.io/public/rss/RSSPolitics' },
    ]
  },
  nyt: {
    cls: 'nyt',
    // NYT: tap headline opens directly in NYT app via Universal Links
    mode: 'link',
    feeds: [
      { id:'nyt-home',      label:'Top News',    url:'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml' },
      { id:'nyt-us',        label:'US',          url:'https://rss.nytimes.com/services/xml/rss/nyt/US.xml' },
      { id:'nyt-world',     label:'World',       url:'https://rss.nytimes.com/services/xml/rss/nyt/World.xml' },
      { id:'nyt-politics',  label:'Politics',    url:'https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml' },
      { id:'nyt-business',  label:'Business',    url:'https://rss.nytimes.com/services/xml/rss/nyt/Business.xml' },
      { id:'nyt-economy',   label:'Economy',     url:'https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml' },
      { id:'nyt-tech',      label:'Tech',        url:'https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml' },
      { id:'nyt-science',   label:'Science',     url:'https://rss.nytimes.com/services/xml/rss/nyt/Science.xml' },
      { id:'nyt-health',    label:'Health',      url:'https://rss.nytimes.com/services/xml/rss/nyt/Health.xml' },
      { id:'nyt-opinion',   label:'Opinion',     url:'https://rss.nytimes.com/services/xml/rss/nyt/Opinion.xml' },
      { id:'nyt-arts',      label:'Arts',        url:'https://rss.nytimes.com/services/xml/rss/nyt/Arts.xml' },
      { id:'nyt-sports',    label:'Sports',      url:'https://rss.nytimes.com/services/xml/rss/nyt/Sports.xml' },
      { id:'nyt-travel',    label:'Travel',      url:'https://rss.nytimes.com/services/xml/rss/nyt/Travel.xml' },
      { id:'nyt-style',     label:'Style',       url:'https://rss.nytimes.com/services/xml/rss/nyt/FashionandStyle.xml' },
    ]
  }
};

const ALL_FEEDS = [...SOURCES.wsj.feeds, ...SOURCES.nyt.feeds];

const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
  u => `https://proxy.cors.sh/${u}`,
];

let feedData = {};
let allArticles = [];
let activePub = 'all';
let activePubKeyword = '';
let activeSection = 'all';
let searchQuery = '';
let currentSorted = [];
let toastTimer = null;

const feedSource = {};
Object.entries(SOURCES).forEach(([src, s]) => s.feeds.forEach(f => { feedSource[f.id] = src; }));

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function copyTitle(title, btn) {
  try { await navigator.clipboard.writeText(title); }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = title; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  if (btn) {
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 1800);
  }
  showToast('Headline copied — paste in Apple News search');
}

function relTime(d) {
  if (!d || isNaN(d)) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

async function tryFetch(url) {
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(5000)});
    if (r.ok) { const t = await r.text(); if (t.includes('<item>')) return t; }
  } catch(e) {}
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url), {signal: AbortSignal.timeout(9000)});
      if (r.ok) { const t = await r.text(); if (t.includes('<item>')) return t; }
    } catch(e) {}
  }
  return null;
}

function parseRSS(text, feedId, label, sourceCls) {
  try {
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const out = [];
    xml.querySelectorAll('item').forEach(item => {
      const title = item.querySelector('title')?.textContent?.trim();
      let link = item.querySelector('link')?.textContent?.trim() || '';
      if (!link) link = item.querySelector('guid')?.textContent?.trim() || '';
      const desc = (item.querySelector('description')?.textContent || '')
        .replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
      const pub = item.querySelector('pubDate')?.textContent?.trim();
      if (!title || title.length < 8 || !link || !link.startsWith('http')) return;
      out.push({ title, link, desc: desc || '', date: pub ? new Date(pub) : null, label, feedId, sourceCls });
    });
    return out;
  } catch(e) { return []; }
}

function getVisibleArticles() {
  let pool;
  if (activePubKeyword) {
    const kw = activePubKeyword.toLowerCase();
    pool = allArticles.filter(a =>
      a.title.toLowerCase().includes(kw) ||
      (a.desc && a.desc.toLowerCase().includes(kw))
    );
  } else if (activePub === 'all') {
    pool = allArticles.slice();
  } else {
    pool = allArticles.filter(a => a.sourceCls === activePub);
    if (activeSection !== 'all') pool = pool.filter(a => a.feedId === activeSection);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    pool = pool.filter(a => a.title.toLowerCase().includes(q));
  }
  return pool.sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1; if (!b.date) return -1;
    return b.date - a.date;
  });
}

function highlight(text, query) {
  if (!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

const copyIcon  = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const checkIcon = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
const linkIcon  = `<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

function render() {
  const sorted = getVisibleArticles();
  currentSorted = sorted;
  const resultEl = document.getElementById('result');
  const badge = document.getElementById('badge');

  if (allArticles.length === 0) {
    resultEl.innerHTML = `<div class="empty">No articles loaded.<br>Check your connection.<br><br><button class="retry-btn" onclick="location.reload()">Retry</button></div>`;
    return;
  }
  if (!sorted.length) {
    badge.textContent = '0 stories'; badge.style.display = 'inline-block';
    const term = searchQuery || activePubKeyword;
    resultEl.innerHTML = `<div class="empty">No headlines match "${term}"</div>`;
    return;
  }

  badge.textContent = sorted.length + ' stories'; badge.style.display = 'inline-block';
  const hlQuery = searchQuery || activePubKeyword;

  const rows = sorted.map((a, i) => {
    const srcMode = SOURCES[a.sourceCls]?.mode || 'copy';
    const sourceLabel = a.sourceCls === 'wsj' ? 'WSJ' : 'NYT';

    if (srcMode === 'link') {
      // NYT: whole card is a link, action button also links
      return `<div class="card-row">
        <a class="card-body" href="${a.link}" target="_blank">
          <span class="card-source ${a.sourceCls}">${sourceLabel} · ${a.label}</span>
          <div class="card-title">${highlight(a.title, hlQuery)}</div>
          ${a.desc ? `<div class="card-desc">${a.desc}</div>` : ''}
          <div class="card-time">${relTime(a.date)}</div>
        </a>
        <a class="card-action" href="${a.link}" target="_blank" aria-label="Open article">
          ${linkIcon}<span>open</span>
        </a>
      </div>`;
    } else {
      // WSJ: copy headline to clipboard
      return `<div class="card-row">
        <div class="card-body" onclick="handleTap(${i})">
          <span class="card-source ${a.sourceCls}">${sourceLabel} · ${a.label}</span>
          <div class="card-title">${highlight(a.title, hlQuery)}</div>
          ${a.desc ? `<div class="card-desc">${a.desc}</div>` : ''}
          <div class="card-time">${relTime(a.date)}</div>
        </div>
        <button class="card-action" onclick="handleCopyBtn(event,${i})" aria-label="Copy headline">
          ${copyIcon}<span>copy</span>
        </button>
      </div>`;
    }
  }).join('');

  const infoText = `<div class="info">
    <strong>NYT:</strong> Tap to open in the NYT app. &nbsp;|&nbsp; <strong>WSJ:</strong> Tap to copy headline, then paste in Apple News search.
  </div>`;

  resultEl.innerHTML = infoText + `<div class="articles">${rows}</div>`;
}

function handleTap(i) {
  const a = currentSorted[i]; if (!a) return;
  const btn = document.querySelectorAll('.card-action')[i];
  copyTitle(a.title, btn);
}

function handleCopyBtn(e, i) {
  e.stopPropagation();
  const a = currentSorted[i]; if (!a) return;
  const btn = e.currentTarget;
  copyTitle(a.title, btn);
  btn.innerHTML = checkIcon + '<span>copied</span>';
  setTimeout(() => { btn.innerHTML = copyIcon + '<span>copy</span>'; }, 2000);
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  const isKeyword = !!activePubKeyword;
  tabsEl.style.display = isKeyword ? 'none' : 'flex';
  if (isKeyword) return;
  let feeds;
  if (activePub === 'all') {
    feeds = ALL_FEEDS;
  } else {
    feeds = SOURCES[activePub] ? SOURCES[activePub].feeds : [];
  }
  tabsEl.innerHTML = [{id:'all', label:'All'}, ...feeds].map(f =>
    `<button class="tab${f.id === activeSection ? ' active' : ''}" data-id="${f.id}">${f.label}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    activeSection = b.dataset.id;
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === activeSection));
    render();
  }));
}

async function loadAll() {
  document.querySelectorAll('.pub-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activePub = btn.dataset.pub;
      activePubKeyword = btn.dataset.keyword || '';
      activeSection = 'all';
      document.querySelectorAll('.pub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildTabs();
      render();
    });
  });

  const searchEl = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  searchEl.addEventListener('input', () => {
    searchQuery = searchEl.value.trim();
    clearBtn.classList.toggle('visible', searchQuery.length > 0);
    render();
  });
  clearBtn.addEventListener('click', () => {
    searchEl.value = ''; searchQuery = '';
    clearBtn.classList.remove('visible');
    searchEl.focus(); render();
  });

  buildTabs();

  await Promise.all(ALL_FEEDS.map(async feed => {
    const src = feedSource[feed.id];
    const text = await tryFetch(feed.url);
    const articles = text ? parseRSS(text, feed.id, feed.label, src) : [];
    feedData[feed.id] = articles;
    const seen = new Set(allArticles.map(a => a.link));
    articles.forEach(a => { if (!seen.has(a.link)) { seen.add(a.link); allArticles.push(a); } });
    if (allArticles.length > 0) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      render();
    }
  }));

  document.getElementById('loading').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  render();
}

loadAll();
</script>
</body>
</html>
